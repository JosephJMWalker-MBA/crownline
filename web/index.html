<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crownline v1</title>
  <link rel="stylesheet" href="/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <main class="shell">
    <section class="stage">
      <canvas id="board"></canvas>
      <div class="brand">CROWNLINE <span>v1.0</span></div>
    </section>
    <aside class="panel">
      <header>
        <div class="eyebrow" id="game-label">GAME 1</div>
        <h1 id="turn-label">Loading…</h1>
        <p id="variant-label"></p>
      </header>

      <section class="score-grid">
        <article><span>PLAYER A</span><strong id="score-a">0</strong></article>
        <article><span>PLAYER B</span><strong id="score-b">0</strong></article>
      </section>

      <section class="metrics">
        <div><span>White bank</span><b id="bank-w">0 / 15</b></div>
        <div><span>Black bank</span><b id="bank-b">0 / 15</b></div>
        <div><span>White melds</span><b id="meld-w">0</b></div>
        <div><span>Black melds</span><b id="meld-b">0</b></div>
      </section>

      <section>
        <div class="section-title">LEGAL MOVES</div>
        <div id="moves" class="moves"></div>
      </section>

      <section id="status" class="status"></section>

      <div class="actions">
        <button id="advance" hidden>Advance game</button>
        <button id="reset" class="secondary">Reset set</button>
      </div>
    </aside>
  </main>

  <dialog id="meld-dialog">
    <h2>Choose Crownline</h2>
    <p>This move completes more than one eligible meld.</p>
    <div id="meld-options"></div>
    <button id="meld-cancel" class="secondary">Cancel</button>
  </dialog>

  <script type="module" src="/main.js"></script>
</body>
</html>
