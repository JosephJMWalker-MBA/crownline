name: Crownline tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Compile Python modules
        run: python -m py_compile *.py experiments/*.py
      - name: Check browser JavaScript
        run: |
          for file in web/main.js web/premium_tabletop.js web/king_glow_visibility.js web/graphics.js web/tracker_preview.js web/rules_mode.js web/crowned_feedback.js web/onboarding.js; do
            node --check "$file"
          done
      - name: Smoke browser rules payload
        run: |
          python - <<'PY'
          import serve_crownline
          payload = serve_crownline.state_payload()
          assert payload['set']['rules']['mode'] == 'candidate'
          assert payload['set']['rules']['experimental'] is True
          assert len(payload['game']['crownline_tracker']['W']) == 8
          assert len(payload['game']['crownline_tracker']['B']) == 8
          PY
      - name: Run Crownline tests
        run: pytest -q
      - name: Run 150ms p200 product head-to-head
        run: |
          PYTHONPATH=. python experiments/benchmark_product_p200_head_to_head.py \
            --budget-ms 150 \
            --max-depth 4 \
            --repeat-penalty 200 \
            --max-game-plies 300 \
            --repetition-limit 3 \
            --json benchmarks/product_candidate_p200_150ms_head_to_head.json
      - name: Upload 150ms p200 product head-to-head
        uses: actions/upload-artifact@v4
        with:
          name: product-candidate-p200-150ms-head-to-head
          path: benchmarks/product_candidate_p200_150ms_head_to_head.json
