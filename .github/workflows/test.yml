name: Crownline tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: crownline-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Compile Python modules
        run: python -m py_compile *.py experiments/*.py
      - name: Run Crownline tests
        run: pytest -q
      - name: Run focused quiescence blame diagnostic
        run: |
          PYTHONPATH=. python experiments/benchmark_quiescence_blame_points_only.py \
            --qdepths 0 1 \
            --depth 3 \
            --maturity-weight 10 \
            --json benchmarks/quiescence_blame_points_only_v0_1.json
      - name: Commit focused quiescence evidence
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmarks/quiescence_blame_points_only_v0_1.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record focused quiescence blame evidence"
          git push
