name: Crownline tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: crownline-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Compile Python modules
        run: python -m py_compile *.py experiments/*.py
      - name: Check browser JavaScript
        run: |
          for file in web/main.js web/premium_tabletop.js web/king_glow_visibility.js web/graphics.js web/tracker_preview.js web/rules_mode.js web/crowned_feedback.js web/onboarding.js web/research_ai.js web/play_export.js; do
            node --check "$file"
          done
      - name: Smoke browser rules payload
        run: |
          python - <<'PY'
          import serve_crownline
          payload = serve_crownline.state_payload()
          assert payload['set']['rules']['mode'] == 'candidate'
          assert payload['set']['rules']['experimental'] is True
          assert len(payload['game']['crownline_tracker']['W']) == 8
          assert len(payload['game']['crownline_tracker']['B']) == 8
          assert serve_crownline._normalize_ai_profile('research') == 'research'
          export = serve_crownline.export_play_record(
              serve_crownline._play_record,
              serve_crownline._session,
          )
          assert export['schema'] == 'crownline.play-record'
          assert export['schema_version'] == 1
          assert export['summary']['games_recorded'] == 1
          PY
      - name: Run Crownline tests
        run: pytest -q
      - name: Run King coverage w160 full trajectory
        run: |
          PYTHONPATH=. python experiments/benchmark_king_coverage_trajectory.py \
            --depth 3 \
            --maturity-weight 10 \
            --coverage-weight 160 \
            --max-game-plies 300 \
            --repetition-limit 3 \
            --json benchmarks/king_coverage_trajectory_w160_v0_1.json
      - name: Upload King coverage w160 trajectory
        uses: actions/upload-artifact@v4
        with:
          name: king-coverage-trajectory-w160-v0-1
          path: benchmarks/king_coverage_trajectory_w160_v0_1.json
      - name: Commit King coverage w160 trajectory evidence
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmarks/king_coverage_trajectory_w160_v0_1.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record King coverage w160 trajectory evidence"
          git push
