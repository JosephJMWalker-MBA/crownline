name: Crownline tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: crownline-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p benchmarks
          {
            echo '=== compile ==='
            python -m py_compile *.py experiments/*.py
            echo "compile_status=$?"
            echo '=== pytest ==='
            pytest -q
            echo "pytest_status=$?"
            echo '=== focused quiescence ==='
            timeout 180s env PYTHONPATH=. python experiments/benchmark_quiescence_blame_points_only.py \
              --qdepths 0 1 2 \
              --depth 3 \
              --maturity-weight 10 \
              --json benchmarks/quiescence_blame_points_only_v0_1.json
            echo "benchmark_status=$?"
          } > benchmarks/quiescence_ci_probe.txt 2>&1
          cat benchmarks/quiescence_ci_probe.txt
          exit 0
      - name: Commit diagnostic probe
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmarks/quiescence_ci_probe.txt
          if [ -f benchmarks/quiescence_blame_points_only_v0_1.json ]; then
            git add benchmarks/quiescence_blame_points_only_v0_1.json
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record quiescence CI diagnostics"
          git push
