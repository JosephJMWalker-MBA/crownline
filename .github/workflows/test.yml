name: Crownline tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: crownline-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Compile Python modules
        run: python -m py_compile *.py experiments/*.py
      - name: Check browser JavaScript
        run: |
          for file in web/main.js web/premium_tabletop.js web/king_glow_visibility.js web/graphics.js web/tracker_preview.js web/rules_mode.js web/crowned_feedback.js web/onboarding.js; do
            node --check "$file"
          done
      - name: Smoke browser rules payload
        run: |
          python - <<'PY'
          import serve_crownline
          payload = serve_crownline.state_payload()
          assert payload['set']['rules']['mode'] == 'candidate'
          assert payload['set']['rules']['experimental'] is True
          assert len(payload['game']['crownline_tracker']['W']) == 8
          assert len(payload['game']['crownline_tracker']['B']) == 8
          PY
      - name: Run Crownline tests
        run: pytest -q
      - name: Run reversed-role composition confirmation
        run: |
          PYTHONPATH=. python experiments/benchmark_maturity_p200_confirmation_150ms.py \
            --budget-ms 150 \
            --max-depth 4 \
            --repeat-penalty 200 \
            --maturity-weight 10 \
            --max-game-plies 300 \
            --repetition-limit 3 \
            --json benchmarks/stage3_maturity_p200_confirmation_150ms.json
      - name: Upload reversed-role composition confirmation
        uses: actions/upload-artifact@v4
        with:
          name: stage3-maturity-p200-confirmation-150ms
          path: benchmarks/stage3_maturity_p200_confirmation_150ms.json
      - name: Commit reversed-role composition confirmation
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmarks/stage3_maturity_p200_confirmation_150ms.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record reversed-role composition confirmation"
          git push
